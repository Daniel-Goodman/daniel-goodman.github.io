    Education:
      - institution: University of Oxford
        location: Oxford
        area: Computer Science
        studyType: DPhil (PhD)
        start_date: 2004
        end_date: 2008
        highlights:
          - A service-oriented architecture and language for abstracted distributed algorithms

      - institution: University of Oxford
        location: Oxford
        area: Computer Science
        studyType: BA Hons 1st class
        start_date: 2000
        end_date: 2004
        highlights:
          - Awarded Hoare prize for top 1st in Computer Science in 2004
          - Awarded Exhibition Scholarship for exceptional academic achievement

    Experience:
      - company: Oracle Labs
        position: Consulting member of technical staff
        location: Remote
        start_date: 2025
        end_date: 2026
        summary: Technical lead on the Sandwood probabilistic programming project
        highlights:
          - Responsible for the design of Sandwood and setting the direction of the project
          - Lead a team of junior researchers
          - Built PoCs with teams across Oracle to take advantage of Sandwood

      - company: Oracle Labs
        position: Principal member of technical staff
        location: Remote
        start_date: 2014
        end_date: 2025
        summary: Technical lead on the Sandwood probabilistic programming project and the Pandia NUMA software performance prediction project
        highlights:
          - Responsible for the design and direction of the Sandwood and Pandia projects
          - Lead a team of junior researchers
          - Built PoCs with teams across Oracle to take advantage of Sandwood
          - Built Pandia as a component of the rack scale computing project

      - company: Advanced Processor Technology group, University of Manchester
        position: Research Associate
        location: Manchester
        start_date: 2010
        end_date: 2014
        summary: Worked on the Teraflux project
        highlights:
          - Architected and built DFScala, a dataflow library for Scala
          - Architected and built MUTS, a Scala software transactional memory library
          - Architected and built Nesoi, a tool to statically check the memory usage of MUTS and DFScala to prevent unprotected shared memory modifications
          - Lectured and ran practicals for the computer architecture course

      - company: Fujitsu Laboratories of Europe
        position: Senior Researcher
        location: Southall
        start_date: 2009
        end_date: 2010

      - company: Oxford eResearch Centre, University of Oxford
        position: Research Associate
        location: Oxford
        start_date: 2007
        end_date: 2009
        summary: Worked on exploring new technologies and applying them to real world problems faced by domain scientists
        highlights:
          - Developed tooling and abstractions to assist in programming in multi-core and GPGPU programming environments
          - Developed PoCs for GPGPU based software for projects ranging from medical imagery, to models of the visual cortex, to real-time processing of radio telescope data to detect pulsars

      - company: Google
        position: Software Engineer
        location: Mountain View
        start_date: 2006
        end_date: 2006
        summary: Summer internship developing monitoring software for the Google Checkout project

      - company: Merton College, University of Oxford
        position: Tutor
        location: Oxford
        start_date: 2005
        end_date: 2009
        summary: Taught object oriented programming

      - company: Computing Laboratory, University of Oxford
        position: Demonstrator
        location: Oxford
        start_date: 2004
        end_date: 2007
        summary: Worked as a demonstrator on a wide range of CS courses

